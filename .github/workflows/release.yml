name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the exe to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: |
          VERSION="${TAG#v}"
          dotnet publish AudioCombiner.csproj -c Release -r win-x64 --self-contained false \
            -p:PublishSingleFile=true -p:DebugType=none -p:Version="$VERSION" -o publish

      - name: Attach to release
        shell: bash
        run: gh release upload "$TAG" publish/AudioCombiner.exe --clobber
